name: Spieltests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:arcade-data
      - run: npm run check:driver-art
      - run: npm run check:arcade3d-engine
      - run: npm run check:arcade-boundaries
      - run: npm test -- --exclude tests/unit/pov-calendar.test.js
      - run: npm run build:offline
      - run: node scripts/build-bahrain-review.js
      - run: node scripts/build-calendar-review.js
      - run: node scripts/build-hud-review.js
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-hud-campaign-review
          path: dist/hud-review/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-calendar-environments
          path: dist/calendar-review/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-bahrain-review
          path: dist/bahrain-review/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-arcade-preview
          path: |
            dist/carpet-grand-prix-arcade-offline.html
            dist/carpet-grand-prix-arcade3d-offline.html
            dist/carpet-grand-prix-race-offline.html
            dist/carpet-grand-prix-campaign-offline.html
            dist/carpet-grand-prix-run-offline.html
            dist/carpet-grand-prix-menu-offline.html
            dist/carpet-grand-prix-offline.html
            dist/carpet-grand-prix-classic-archive.html
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-offline
          path: |
            dist/carpet-grand-prix*offline.html
            dist/carpet-grand-prix-classic-archive.html
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --grep-invert 'POV-Kalender:|Qualifying:|POV-Karriere:|Kampagne:|Bahrain-Welt:|Streckenwelten:|Roguelite:'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  bahrain-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/bahrain-world.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bahrain-world-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  qualifying:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/qualifying.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qualifying-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  pov-career:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/pov-career.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pov-career-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  pov-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    env:
      CGP_POV_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/unit/pov-calendar.test.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/pov-calendar.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pov-calendar-diagnostics-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  calendar-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
        group: [0, 1, 2]
    env:
      CGP_ENV_TEST_GROUP: ${{ matrix.group }}
      CGP_ENV_ARTIFACT_DIR: dist/calendar-environment-proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:offline && npm run build:calendar-review
        if: matrix.group == 0
      - run: npx playwright test tests/browser/calendar-environments.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-environments-${{ matrix.project }}-${{ matrix.group }}
          path: |
            dist/calendar-environment-proof/
            playwright-report/
            test-results/
          retention-days: 14

  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/campaign.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-${{ matrix.project }}
          path: |
            docs/campaign/
            docs/racing-hud/
            playwright-report/
            test-results/
          retention-days: 30

  roguelite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/roguelite-run.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roguelite-${{ matrix.project }}
          path: |
            docs/roguelite/
            playwright-report/
            test-results/
          retention-days: 30
