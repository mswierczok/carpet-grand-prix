name: Spieltests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:arcade3d-engine
      - run: npm run check:arcade-boundaries
      - run: npm test -- --exclude tests/unit/pov-calendar.test.js
      - run: npm run build:offline
      - run: npm run build:arcade-offline
      - run: npm run build:race-preview
      - run: npm run build:pilot-preview
      - run: npm run build:world-review
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-arcade-preview
          path: |
            dist/carpet-grand-prix-arcade-offline.html
            dist/carpet-grand-prix-arcade3d-offline.html
            dist/carpet-grand-prix-race-offline.html
            dist/carpet-grand-prix-offline.html
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-world-and-drivers
          path: |
            dist/carpet-grand-prix-world-and-drivers.html
            dist/carpet-grand-prix-offline.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-art-pilot
          path: |
            dist/carpet-grand-prix-art-pilot.html
            dist/carpet-grand-prix-offline.html
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-topdown-preview
          path: |
            dist/carpet-grand-prix-topdown-preview.html
            dist/carpet-grand-prix-offline.html
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-grand-prix-offline
          path: dist/carpet-grand-prix-offline.html
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=${{ matrix.project }} --grep-invert 'POV-Kalender:|Qualifying:'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  qualifying:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/qualifying.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qualifying-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  pov-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    env:
      CGP_POV_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/unit/pov-calendar.test.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/pov-calendar.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pov-calendar-diagnostics-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
